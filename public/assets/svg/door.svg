<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" width="180" height="260">
  <defs>
    <linearGradient id="dframe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9dd0" />
      <stop offset="0.25" stop-color="#e6ecff" />
      <stop offset="0.75" stop-color="#c3cdf0" />
      <stop offset="1" stop-color="#7986bd" />
    </linearGradient>
    <linearGradient id="dpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25306b" />
      <stop offset="1" stop-color="#121a3a" />
    </linearGradient>
    <radialGradient id="dglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.2" stop-color="#7ef0ff" stop-opacity="0.75" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <filter id="dsh" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#050a1e" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#dsh)">
    <rect x="8" y="10" width="164" height="242" rx="26" fill="url(#dframe)" />
    <rect x="22" y="24" width="136" height="214" rx="18" fill="url(#dpanel)" />
    <!-- vidro superior -->
    <rect x="40" y="42" width="100" height="56" rx="14" fill="#0d1430" stroke="#3f4d94" stroke-width="3" />
    <ellipse cx="90" cy="70" rx="40" ry="22" fill="url(#dglow)" />
    <!-- linhas de abertura -->
    <path d="M90 110v122" stroke="#3f4d94" stroke-width="3" />
    <rect x="34" y="118" width="46" height="8" rx="4" fill="#3f4d94" />
    <rect x="100" y="118" width="46" height="8" rx="4" fill="#3f4d94" />
    <!-- painel de acesso -->
    <rect x="66" y="150" width="48" height="34" rx="10" fill="#1a2455" stroke="#4a5aa8" stroke-width="2.5" />
    <circle cx="80" cy="167" r="5" fill="#34d399" />
    <circle cx="100" cy="167" r="5" fill="#ffc94d" />
    <!-- luzes laterais -->
    <rect x="14" y="70" width="6" height="120" rx="3" fill="#22d3ee" opacity="0.8" />
    <rect x="160" y="70" width="6" height="120" rx="3" fill="#22d3ee" opacity="0.8" />
  </g>
</svg>
