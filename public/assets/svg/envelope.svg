<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <linearGradient id="epaper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff8e6" />
      <stop offset="1" stop-color="#e7d9b4" />
    </linearGradient>
    <linearGradient id="eflap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4" />
      <stop offset="1" stop-color="#e9dcbb" />
    </linearGradient>
    <filter id="eshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#080e26" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#eshadow)">
    <rect x="10" y="20" width="220" height="130" rx="10" fill="url(#epaper)" stroke="#c9b784" stroke-width="3" />
    <path d="M13 26 120 96 227 26" fill="none" stroke="#c9b784" stroke-width="3" />
    <path d="M10 30 120 100 230 30V26a8 8 0 0 0-8-8H18a8 8 0 0 0-8 8Z" fill="url(#eflap)" stroke="#c9b784" stroke-width="3" />
    <!-- selo de cera -->
    <circle cx="120" cy="98" r="24" fill="#e0454f" />
    <circle cx="120" cy="98" r="17" fill="none" stroke="#ffd0d3" stroke-width="2.5" opacity="0.65" />
    <path d="M120 86c5 5 8 11 8 18h-16c0-7 3-13 8-18Z" fill="#ffe3e5" />
