<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="suit" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#e6ecff" />
      <stop offset="1" stop-color="#b7c4ea" />
    </linearGradient>
    <radialGradient id="visor" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#9df6ff" />
      <stop offset="0.42" stop-color="#3a8ae0" />
      <stop offset="1" stop-color="#101a4a" />
    </radialGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea0d8" />
      <stop offset="1" stop-color="#5566a6" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0a0f2c" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- mochila -->
    <rect x="38" y="46" width="52" height="42" rx="12" fill="url(#pack)" />
    <rect x="46" y="52" width="12" height="8" rx="3" fill="#22d3ee" opacity="0.9" />

    <!-- pernas -->
    <path d="M50 84h11v24a6 6 0 0 1-12 0V88Z" fill="url(#suit)" />
    <path d="M67 84h11v20a6 6 0 0 1-12 0V88Z" fill="url(#suit)" />
    <rect x="47" y="106" width="17" height="10" rx="5" fill="#4a5aa8" />
    <rect x="64" y="102" width="17" height="10" rx="5" fill="#4a5aa8" />

    <!-- braços -->
    <path d="M36 58a9 9 0 0 1 9-9h4v20h-4a9 9 0 0 1-9-9Z" fill="url(#suit)" />
    <path d="M92 58a9 9 0 0 0-9-9h-4v20h4a9 9 0 0 0 9-9Z" fill="url(#suit)" />
    <circle cx="34" cy="62" r="7" fill="#4a5aa8" />
    <circle cx="94" cy="62" r="7" fill="#4a5aa8" />

    <!-- torso -->
    <rect x="44" y="46" width="40" height="44" rx="16" fill="url(#suit)" />
    <rect x="55" y="58" width="18" height="13" rx="5" fill="#2b3a78" />
    <circle cx="60" cy="64" r="2.4" fill="#34d399" />
    <circle cx="68" cy="64" r="2.4" fill="#ffc94d" />
    <path d="M44 76h40" stroke="#7c4dff" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- capacete -->
    <circle cx="64" cy="38" r="30" fill="#f2f5ff" />
    <circle cx="64" cy="38" r="30" fill="none" stroke="#c3cdf0" stroke-width="3" />
    <circle cx="64" cy="38" r="23" fill="url(#visor)" />
    <path d="M50 26a20 20 0 0 1 15-6c-8 2-14 8-16 16-1 4-4 3-3-1 .6-3.6 2.3-6.7 4-9Z" fill="#ffffff" opacity="0.65" />
    <circle cx="76" cy="48" r="4" fill="#ffffff" opacity="0.35" />
    <rect x="58" y="8" width="12" height="7" rx="3.5" fill="#ff4d9d" />
  </g>
