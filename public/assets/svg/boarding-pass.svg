    <!-- canhoto -->
    <rect x="300" y="10" width="112" height="200" rx="20" fill="url(#bpstrip)" />
    <path d="M300 10v200" stroke="#fffdf6" stroke-width="4" stroke-dasharray="10 8" />
    <!-- foguete no canhoto -->
    <path d="M356 74c9 9 13.5 20 13.5 33l-5 10h-17l-5-10c0-13 4.5-24 13.5-33Z" fill="#ffffff" />
