<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
  <defs>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6" />
      <stop offset="0.6" stop-color="#f6f2e4" />
      <stop offset="1" stop-color="#e2dcc6" />
    </linearGradient>
    <linearGradient id="bpstrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4dff" />
      <stop offset="1" stop-color="#4a1fd0" />
    </linearGradient>
    <filter id="bpsh" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#060b20" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#bpsh)">
    <rect x="8" y="10" width="404" height="200" rx="20" fill="url(#bp)" />
