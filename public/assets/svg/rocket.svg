<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 180" width="128" height="180">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9dd0" />
      <stop offset="0.3" stop-color="#ffffff" />
      <stop offset="0.75" stop-color="#e3e9ff" />
      <stop offset="1" stop-color="#9aa6d6" />
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ab0" />
      <stop offset="0.4" stop-color="#ff4d9d" />
      <stop offset="1" stop-color="#c92e72" />
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ec4" />
      <stop offset="1" stop-color="#d43a80" />
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b9f7ff" />
      <stop offset="0.5" stop-color="#33a0e0" />
      <stop offset="1" stop-color="#16306e" />
    </radialGradient>
    <filter id="rshadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#080d24" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#rshadow)">
    <!-- aletas -->
    <path d="M40 108c-14 6-22 18-24 34 12-2 22-8 30-16Z" fill="url(#fin)" />
    <path d="M88 108c14 6 22 18 24 34-12-2-22-8-30-16Z" fill="url(#fin)" />
    <!-- corpo -->
    <path d="M64 6c18 18 27 42 27 68v44H37V74C37 48 46 24 64 6Z" fill="url(#hull)" />
    <!-- bico -->
    <path d="M64 6c8 8 14 18 18 29H46c4-11 10-21 18-29Z" fill="url(#nose)" />
    <!-- janela -->
    <circle cx="64" cy="66" r="19" fill="#c9d3f4" />
    <circle cx="64" cy="66" r="15" fill="url(#glass)" />
    <path d="M53 58a14 14 0 0 1 11-6c-6 2-9 6-10 11-.6 3-3 2-2.4-.6.3-1.7.9-3.2 1.4-4.4Z" fill="#fff" opacity="0.6" />
    <!-- faixas -->
    <rect x="37" y="94" width="54" height="9" rx="4" fill="#7c4dff" opacity="0.9" />
    <rect x="37" y="106" width="54" height="6" rx="3" fill="#22d3ee" opacity="0.8" />
    <!-- motor -->
    <path d="M46 118h36l-5 14H51Z" fill="#5b68a8" />
    <rect x="49" y="130" width="30" height="7" rx="3.5" fill="#414d86" />
