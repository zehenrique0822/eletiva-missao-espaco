<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="coat" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d8e0f7" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3b2e" />
      <stop offset="1" stop-color="#2f1c15" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6bff" />
      <stop offset="1" stop-color="#5a34d6" />
    </linearGradient>
    <filter id="pshadow" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0a0f2c" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#pshadow)">
    <!-- cabelo (volume de trás) -->
    <path d="M62 74c-8-34 12-58 38-58s46 24 38 58c-4 18-6 34-4 52H66c2-18 0-34-4-52Z" fill="url(#hair)" />

    <!-- corpo / jaleco -->
    <path d="M56 246c0-40 6-70 20-84 8-8 16-12 24-12s16 4 24 12c14 14 20 44 20 84Z" fill="url(#coat)" />
    <path d="M100 150c-9 0-17-4-22-11l10-9c4 4 8 6 12 6s8-2 12-6l10 9c-5 7-13 11-22 11Z" fill="url(#shirt)" />
    <path d="M88 152h24l-6 44h-12Z" fill="url(#shirt)" opacity="0.35" />

    <!-- braços -->
    <path d="M64 168c-10 12-14 32-13 56l16 2c1-22 4-38 10-48Z" fill="url(#coat)" />
    <path d="M136 168c10 12 14 32 13 56l-16 2c-1-22-4-38-10-48Z" fill="url(#coat)" />

    <!-- pescoço -->
    <path d="M90 118h20v20a10 10 0 0 1-20 0Z" fill="#e8b48f" />

    <!-- rosto -->
    <ellipse cx="100" cy="88" rx="34" ry="38" fill="#f6c9a3" />
    <!-- franja -->
    <path d="M66 84c0-26 15-40 34-40s34 14 34 40c-6-12-18-20-34-20s-28 8-34 20Z" fill="url(#hair)" />
    <!-- olhos -->
    <ellipse cx="87" cy="88" rx="4.4" ry="5" fill="#2b1c14" />
    <ellipse cx="113" cy="88" rx="4.4" ry="5" fill="#2b1c14" />
    <circle cx="88.6" cy="86" r="1.6" fill="#fff" />
    <circle cx="114.6" cy="86" r="1.6" fill="#fff" />
    <!-- sobrancelhas -->
    <path d="M80 79q7-5 14-1" stroke="#3d271c" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M106 78q7-4 14 1" stroke="#3d271c" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- sorriso -->
    <path d="M90 102q10 10 20 0" stroke="#8c4a3a" stroke-width="3.4" fill="none" stroke-linecap="round" />
    <circle cx="78" cy="99" r="5" fill="#f19b9b" opacity="0.45" />
    <circle cx="122" cy="99" r="5" fill="#f19b9b" opacity="0.45" />

    <!-- crachá da missão -->
    <rect x="118" y="176" width="26" height="20" rx="5" fill="#ffc94d" stroke="#c8912a" stroke-width="2" />
    <path d="M131 180c3 3 4.6 6.4 4.6 10h-9.2c0-3.6 1.6-7 4.6-10Z" fill="#ff4d9d" />

    <!-- óculos apoiados na cabeça -->
    <circle cx="86" cy="58" r="10" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.9" />
    <circle cx="114" cy="58" r="10" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.9" />
    <path d="M96 58h8" stroke="#22d3ee" stroke-width="3" />
  </g>
</svg>
