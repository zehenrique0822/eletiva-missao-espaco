<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1026" />
    <meta
      name="description"
      content="Missão Espaço: jogo educativo da eletiva A Ciência por Trás das Grandes Descobertas."
    />
    <link rel="icon" type="image/svg+xml" href="./assets/svg/favicon.svg" />

    <!-- Fontes gratuitas (Google Fonts). O jogo funciona offline com a pilha de fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Missão Espaço — A Ciência por Trás das Grandes Descobertas</title>
  </head>
  <body>
    <!-- Tela de carregamento inicial (removida assim que o Phaser inicia) -->
    <div id="boot-splash">
      <div class="boot-rocket">🚀</div>
      <p class="boot-title">MISSÃO ESPAÇO</p>
      <p class="boot-sub">preparando a plataforma de lançamento…</p>
    </div>

    <!-- Canvas do Phaser -->
    <div id="game"></div>

    <!-- Camada HTML sobreposta: usada por formulários e documentos imprimíveis -->
    <div id="ui-layer" aria-live="polite"></div>

    <!-- Aviso de orientação para celulares em modo retrato -->
    <div id="rotate-hint" hidden>
      <div class="rotate-inner">
        <div class="rotate-icon">📱</div>
        <p><strong>Gire o aparelho</strong></p>
        <p>A missão fica muito melhor na horizontal!</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
